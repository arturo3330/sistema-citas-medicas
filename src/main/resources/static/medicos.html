<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>
        Médicos | Makanitos
    </title>

    <link
            rel="stylesheet"
            href="css/estilos.css">

</head>


<body>


<!-- ==========================================
     NAVBAR GLOBAL MAKANITOS
     ========================================== -->

<div id="appNavbar">
</div>


<!-- ==========================================
     CONTENIDO PRINCIPAL
     ========================================== -->

<main class="contenido">


    <!-- ======================================
         ENCABEZADO
         ====================================== -->

    <div class="pagina-encabezado">

        <div>

            <h2>
                Médicos
            </h2>

            <p>
                Registra y administra los médicos
                disponibles en Makanitos.
            </p>

        </div>

    </div>


    <!-- ======================================
         FORMULARIO
         ====================================== -->

    <section class="formulario-seccion">

        <h3>
            Registrar médico
        </h3>


        <input
                type="hidden"
                id="idMedico">


        <div class="form-grid">


            <div class="form-grupo">

                <label for="nombre">
                    Nombre
                </label>

                <input
                        type="text"
                        id="nombre"
                        placeholder="Ej. Dr. Carlos Ramos">

            </div>


            <div class="form-grupo">

                <label for="cmp">
                    CMP
                </label>

                <input
                        type="text"
                        id="cmp"
                        placeholder="Ej. 12345">

            </div>


            <div class="form-grupo">

                <label for="especialidad">
                    Especialidad
                </label>

                <select id="especialidad">
                </select>

            </div>


            <div class="form-grupo">

                <label for="estado">
                    Estado
                </label>

                <select id="estado">

                    <option value="true">
                        Activo
                    </option>

                    <option value="false">
                        Inactivo
                    </option>

                </select>

            </div>


        </div>


        <div class="form-acciones">

            <button
                    type="button"
                    onclick="guardar()">

                Guardar

            </button>

        </div>


    </section>


    <!-- ======================================
         LISTADO
         ====================================== -->

    <section class="tabla-seccion">

        <div class="tabla-encabezado">

            <div>

                <h3>
                    Médicos registrados
                </h3>

                <p>
                    Lista de médicos registrados
                    en el sistema.
                </p>

            </div>

        </div>


        <div class="tabla-responsive">

            <table>

                <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Nombre
                    </th>

                    <th>
                        CMP
                    </th>

                    <th>
                        Especialidad
                    </th>

                    <th>
                        Estado
                    </th>

                    <th>
                        Acciones
                    </th>

                </tr>

                </thead>


                <tbody id="tablaMedicos">
                </tbody>

            </table>

        </div>

    </section>


</main>


<!-- ==========================================
     SCRIPTS
     ========================================== -->

<script src="js/sesion.js"></script>


<script>

    protegerPersonalClinica();

</script>


<script src="js/navbar.js"></script>

<script src="js/medicos.js"></script>


</body>

</html>
