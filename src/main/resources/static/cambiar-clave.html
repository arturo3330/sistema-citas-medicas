<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>
        Cambiar contraseña | Makanitos
    </title>

    <link
            rel="stylesheet"
            href="css/estilos.css">

</head>

<body>


<!-- ==========================================
     NAVBAR GLOBAL MAKANITOS
     ========================================== -->

<div id="appNavbar">
</div>


<!-- ==========================================
     CONTENIDO PRINCIPAL
     ========================================== -->

<main class="contenido cuenta-contenido">


    <!-- ======================================
         ENCABEZADO
         ====================================== -->

    <div class="pagina-encabezado">

        <div>

            <h2>
                Cambiar contraseña
            </h2>

            <p>
                Actualiza la contraseña de acceso
                de tu cuenta.
            </p>

        </div>

    </div>


    <!-- ======================================
         SEGURIDAD
         ====================================== -->

    <section class="formulario-seccion seguridad-clave">


        <div class="seguridad-clave-encabezado">

            <div class="seguridad-clave-icono">
                🔒
            </div>

            <div>

                <h3>
                    Seguridad de la cuenta
                </h3>

                <p>
                    Elige una nueva contraseña
                    diferente a la actual.
                </p>

            </div>

        </div>


        <!-- ==================================
             USUARIO
             ================================== -->

        <div class="usuario-seguridad">

            <span>
                Usuario
            </span>

            <strong id="usuarioActual">
                -
            </strong>

        </div>


        <!-- ==================================
             FORMULARIO
             ================================== -->

        <div class="form-grid clave-grid">


            <div class="form-grupo form-columna-completa">

                <label for="claveActual">
                    Contraseña actual
                </label>

                <input
                        type="password"
                        id="claveActual"
                        autocomplete="current-password"
                        placeholder="Ingrese su contraseña actual">

            </div>


            <div class="form-grupo">

                <label for="claveNueva">
                    Nueva contraseña
                </label>

                <input
                        type="password"
                        id="claveNueva"
                        autocomplete="new-password"
                        placeholder="Ingrese la nueva contraseña">

            </div>


            <div class="form-grupo">

                <label for="confirmarClave">
                    Confirmar nueva contraseña
                </label>

                <input
                        type="password"
                        id="confirmarClave"
                        autocomplete="new-password"
                        placeholder="Repita la nueva contraseña">

            </div>


        </div>


        <!-- ==================================
             ACCIONES
             ================================== -->

        <div class="form-acciones">

            <button
                    type="button"
                    onclick="cambiarClave()">

                Cambiar contraseña

            </button>

        </div>


        <!-- ==================================
             MENSAJE
             ================================== -->

        <p
                id="mensaje"
                class="mensaje-formulario">
        </p>


    </section>


</main>


<!-- ==========================================
     SCRIPTS
     ========================================== -->

<script src="js/sesion.js"></script>

<script src="js/navbar.js"></script>

<script src="js/cambiar-clave.js"></script>


</body>

</html>
