<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        Horarios
    </title>

    <link
            rel="stylesheet"
            href="css/estilos.css">

</head>


<body>


<header>

    <h1>
        Mantenimiento de Horarios
    </h1>

</header>


<div class="menu">

    <a href="dashboard.html">
        Inicio
    </a>

    <a href="especialidades.html">
        Especialidades
    </a>

    <a href="medicos.html">
        Médicos
    </a>

    <a href="pacientes.html">
        Pacientes
    </a>

    <a href="horarios.html">
        Horarios
    </a>

    <a href="citas.html">
        Citas
    </a>

    <a href="cambiar-clave.html">
        Cambiar contraseña
    </a>

    <a
            href="#"
            onclick="cerrarSesion()">

        Cerrar sesión

    </a>

</div>


<div class="contenido">

    <h2>
        Registrar horario
    </h2>


    <input
            type="hidden"
            id="idHorario">


    <label>
        Médico
    </label>

    <select id="medico">
    </select>


    <label>
        Fecha
    </label>

    <input
            type="date"
            id="fecha">


    <label>
        Hora
    </label>

    <input
            type="time"
            id="hora">


    <label>
        Estado
    </label>

    <select id="estado">

        <option value="DISPONIBLE">
            Disponible
        </option>

        <option value="RESERVADO">
            Reservado
        </option>

        <option value="CANCELADO">
            Cancelado
        </option>

    </select>


    <button onclick="guardar()">

        Guardar

    </button>


    <hr>


    <h2>
        Horarios registrados
    </h2>


    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Médico</th>

            <th>Especialidad</th>

            <th>Fecha</th>

            <th>Hora</th>

            <th>Estado</th>

            <th>Acciones</th>

        </tr>

        </thead>


        <tbody id="tablaHorarios">
        </tbody>

    </table>

</div>


<script src="js/sesion.js"></script>
<script>
    protegerAdmin();
</script>
<script src="js/horarios.js"></script>


</body>

</html>
