<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Especialidades</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header>
    <h1>Mantenimiento de Especialidades</h1>
</header>

<div class="menu">

    <a href="dashboard.html">Inicio</a>

    <a href="especialidades.html">Especialidades</a>

        Cerrar sesión
    </a>

<div class="contenido">

    <h2>Nueva especialidad</h2>

    <input
            type="hidden"
            id="idEspecialidad">

    <label>Nombre</label>

    <input
            type="text"
            id="nombre">

    <label>Estado</label>

    <select id="estado">

        <option value="true">
            Activo
        </option>

        <option value="false">
            Inactivo
        </option>

    </select>


    <button onclick="guardar()">
        Guardar
    </button>

    <hr>


    <h2>Especialidades registradas</h2>

    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Nombre</th>

            <th>Estado</th>

            <th>Acciones</th>

        </tr>

        </thead>

        <tbody id="tablaEspecialidades">
        </tbody>

    </table>

</div>

    protegerAdmin();
</script>
