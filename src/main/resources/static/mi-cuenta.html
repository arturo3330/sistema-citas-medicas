<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>
        Mi cuenta | Makanitos
    </title>

    <link
            rel="stylesheet"
            href="css/estilos.css">

</head>

<body>


<!-- ==========================================
     NAVBAR
     ========================================== -->

<div id="appNavbar">
</div>


<!-- ==========================================
     CONTENIDO
     ========================================== -->

<main class="contenido cuenta-contenido">


    <div class="cuenta-encabezado">

        <div>

            <h2>
                Mi cuenta
            </h2>

            <p>
                Consulta la información asociada
                a tu usuario.
            </p>

        </div>

    </div>


    <!-- ======================================
         TARJETA PERFIL
         ====================================== -->

    <section class="cuenta-card">


        <div class="cuenta-avatar-grande"
             id="avatarCuenta">

            U

        </div>


        <div class="cuenta-identidad">

            <h3 id="nombreCuenta">
                Usuario
            </h3>

            <p id="usernameCuenta">
                -
            </p>

            <span
                    id="rolCuenta"
                    class="cuenta-rol">

                -

            </span>

        </div>

    </section>


    <!-- ======================================
         INFORMACIÓN GENERAL
         ====================================== -->

    <section class="cuenta-seccion">

        <h3>
            Información de la cuenta
        </h3>


        <div class="cuenta-grid">


            <div class="cuenta-dato">

                <span class="cuenta-label">
                    Nombre
                </span>

                <strong id="datoNombre">
                    -
                </strong>

            </div>


            <div class="cuenta-dato">

                <span class="cuenta-label">
                    Usuario
                </span>

                <strong id="datoUsername">
                    -
                </strong>

            </div>


            <div class="cuenta-dato">

                <span class="cuenta-label">
                    Rol
                </span>

                <strong id="datoRol">
                    -
                </strong>

            </div>


            <div class="cuenta-dato">

                <span class="cuenta-label">
                    Estado
                </span>

                <strong id="datoEstado">
                    -
                </strong>

            </div>

        </div>

    </section>


    <!-- ======================================
         DATOS DEL PACIENTE
         ====================================== -->

    <section
            id="seccionPacienteCuenta"
            class="cuenta-seccion"
            style="display:none;">

        <h3>
            Información del paciente
        </h3>


        <div class="cuenta-grid">


            <div class="cuenta-dato">

                <span class="cuenta-label">
                    DNI
                </span>

                <strong id="datoDni">
                    -
                </strong>

            </div>


            <div class="cuenta-dato">

                <span class="cuenta-label">
                    Teléfono
                </span>

                <strong id="datoTelefono">
                    -
                </strong>

            </div>


            <div class="cuenta-dato">

                <span class="cuenta-label">
                    Correo electrónico
                </span>

                <strong id="datoCorreo">
                    -
                </strong>

            </div>


        </div>

    </section>


    <!-- ======================================
         SEGURIDAD
         ====================================== -->

    <section class="cuenta-seccion">

        <h3>
            Seguridad
        </h3>


        <div class="cuenta-seguridad">

            <div>

                <strong>
                    Contraseña
                </strong>

                <p>
                    Puedes actualizar tu contraseña
                    cuando lo necesites.
                </p>

            </div>


            <a
                    href="cambiar-clave.html"
                    class="cuenta-boton">

                Cambiar contraseña

            </a>

        </div>

    </section>


</main>


<!-- ==========================================
     SCRIPTS
     ========================================== -->

<script src="js/sesion.js"></script>

<script src="js/navbar.js"></script>

<script src="js/mi-cuenta.js"></script>


</body>

</html>
