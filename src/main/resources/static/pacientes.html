<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>
        Pacientes | Makanitos
    </title>

    <link
            rel="stylesheet"
            href="css/estilos.css">

</head>


<body>


<!-- ==========================================
     NAVBAR GLOBAL MAKANITOS
     ========================================== -->

<div id="appNavbar">
</div>


<!-- ==========================================
     CONTENIDO PRINCIPAL
     ========================================== -->

<main class="contenido">


    <!-- ======================================
         ENCABEZADO
         ====================================== -->

    <div class="pagina-encabezado">

        <div>

            <h2>
                Pacientes
            </h2>

            <p>
                Registra y administra los pacientes
                atendidos en Makanitos.
            </p>

        </div>

    </div>


    <!-- ======================================
         FORMULARIO
         ====================================== -->

    <section class="formulario-seccion">

        <h3>
            Registrar paciente
        </h3>


        <input
                type="hidden"
                id="idPaciente">


        <div class="form-grid">


            <!-- ==================================
                 DNI
                 ================================== -->

            <div class="form-grupo">

                <label for="dni">
                    DNI
                </label>

                <input
                        type="text"
                        id="dni"
                        maxlength="8"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        oninput="
                            this.value =
                            this.value
                                .replace(/[^0-9]/g,'')
                                .slice(0,8)
                        "
                        placeholder="Ej. 12345678">

                <small class="texto-ayuda">
                    Solo números. Máximo 8 dígitos.
                </small>

            </div>


            <!-- ==================================
                 NOMBRE
                 ================================== -->

            <div class="form-grupo">

                <label for="nombre">
                    Nombre
                </label>

                <input
                        type="text"
                        id="nombre"
                        placeholder="Ej. Ana Torres">

            </div>


            <!-- ==================================
                 TELÉFONO
                 ================================== -->

            <div class="form-grupo">

                <label for="telefono">
                    Teléfono
                </label>

                <input
                        type="text"
                        id="telefono"
                        maxlength="10"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        oninput="
                            this.value =
                            this.value
                                .replace(/[^0-9]/g,'')
                                .slice(0,10)
                        "
                        placeholder="Ej. 999888777">

                <small class="texto-ayuda">
                    Solo números. Máximo 10 dígitos.
                </small>

            </div>


            <!-- ==================================
                 CORREO
                 ================================== -->

            <div class="form-grupo">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                        type="email"
                        id="correo"
                        placeholder="Ej. paciente@correo.com">

            </div>


        </div>


        <!-- ==================================
             ACCIONES
             ================================== -->

        <div class="form-acciones">

            <button
                    type="button"
                    onclick="guardar()">

                Guardar

            </button>

        </div>


        <!-- ==================================
             MENSAJE
             ================================== -->

        <p
                id="mensaje"
                class="mensaje-formulario">
        </p>


    </section>


    <!-- ======================================
         LISTADO
         ====================================== -->

    <section class="tabla-seccion">

        <div class="tabla-encabezado">

            <div>

                <h3>
                    Pacientes registrados
                </h3>

                <p>
                    Lista de pacientes registrados
                    en el sistema.
                </p>

            </div>

        </div>


        <div class="tabla-responsive">

            <table>

                <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        DNI
                    </th>

                    <th>
                        Nombre
                    </th>

                    <th>
                        Teléfono
                    </th>

                    <th>
                        Correo
                    </th>

                    <th>
                        Acciones
                    </th>

                </tr>

                </thead>


                <tbody id="tablaPacientes">
                </tbody>

            </table>

        </div>

    </section>


</main>


<!-- ==========================================
     SCRIPTS
     ========================================== -->

<script src="js/sesion.js"></script>


<script>

    protegerPersonalClinica();

</script>


<script src="js/navbar.js"></script>

<script src="js/pacientes.js"></script>


</body>

</html>
