<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        Pacientes
    </title>

    <link
            rel="stylesheet"
            href="css/estilos.css">

</head>


<body>


<header>

    <h1>
        Mantenimiento de Pacientes
    </h1>

</header>


<div class="menu">

    <a href="dashboard.html">
        Inicio
    </a>

    <a href="especialidades.html">
        Especialidades
    </a>

    <a href="medicos.html">
        Médicos
    </a>

    <a href="pacientes.html">
        Pacientes
    </a>

    <a href="horarios.html">
        Horarios
    </a>

    <a href="citas.html">
        Citas
    </a>

    <a href="cambiar-clave.html">
        Cambiar contraseña
    </a>

    <a
            href="#"
            onclick="cerrarSesion()">

        Cerrar sesión

    </a>

</div>


<div class="contenido">

    <h2>
        Registrar paciente
    </h2>


    <input
            type="hidden"
            id="idPaciente">


    <label>
        DNI
    </label>

    <input
            type="text"
            id="dni"
            maxlength="8">


    <label>
        Nombre
    </label>

    <input
            type="text"
            id="nombre">


    <label>
        Teléfono
    </label>

    <input
            type="text"
            id="telefono">


    <label>
        Correo
    </label>

    <input
            type="email"
            id="correo">


    <button onclick="guardar()">

        Guardar

    </button>


    <hr>


    <h2>
        Pacientes registrados
    </h2>


    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>DNI</th>

            <th>Nombre</th>

            <th>Teléfono</th>

            <th>Correo</th>

            <th>Acciones</th>

        </tr>

        </thead>


        <tbody id="tablaPacientes">
        </tbody>

    </table>

</div>


<script src="js/sesion.js"></script>
<script>
    protegerAdmin();
</script>
<script src="js/pacientes.js"></script>


</body>
